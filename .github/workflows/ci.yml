name: Build and Release Wheels

on:
  push:
    tags:
      - "v*.*.*" # Trigger for official releases when a tag is pushed
    branches:
      - develop  # Trigger for pre-releases when develop branch is pushed

  workflow_dispatch: # Allow manual triggering

concurrency:
  group: build-wheel-${{ github.ref }} # Ensure concurrency is per-branch/tag
  cancel-in-progress: true

permissions:
  contents: write # Needed for creating GitHub Releases

jobs:
  build-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build wheel (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t mootdx-builder-${{ matrix.python-version }} \
            -f ${{ github.workspace }}/.github/docker/Dockerfile .

          mkdir -p dist dist_temp

          CONTAINER_ID=$(docker create mootdx-builder-${{ matrix.python-version }})
          docker cp "$CONTAINER_ID:/app/dist/." dist_temp/ || echo "No wheels found in container /app/dist/"
          docker rm "$CONTAINER_ID"

          if [ -n "$(ls -A dist_temp)" ]; then
            mv dist_temp/* dist/
          else
            echo "No wheels were copied from the container."
          fi
          ls -alh dist/ || echo "dist directory is empty or not found."

      - name: Set up Python (Windows only)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip build wheel setuptools
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Build wheel (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          if (Test-Path setup.py) {
            python setup.py bdist_wheel
          } elseif (Test-Path pyproject.toml) {
            python -m build --wheel
          } else {
            echo "No setup.py or pyproject.toml found. Cannot build wheel."
            exit 1
          }

      - name: Identify built wheel
        shell: bash
        id: find_whl
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            WHEEL_PATH=$(find dist -name "*.whl" -print -quit)
          else # windows-latest
            WHEEL_PATH=$(powershell -Command "Get-ChildItem -Path dist -Filter '*.whl' | Select-Object -First 1 | ForEach-Object { $_.FullName }")
          fi

          if [ -z "$WHEEL_PATH" ]; then
            echo "No wheel file found in dist directory."
            echo "wheel_path=" >> "$GITHUB_OUTPUT"
          else
            echo "wheel_path=$WHEEL_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        if: steps.find_whl.outputs.wheel_path != ''
        with:
          name: mootdx-${{ matrix.python-version }}-${{ matrix.os }}
          path: ${{ steps.find_whl.outputs.wheel_path }}

  release:
    name: Create GitHub Release
    needs: build-wheel
    runs-on: ubuntu-latest
    # This job will run if a tag is pushed OR if develop branch is pushed
    # The logic inside determines if it's a formal or pre-release.
    if: github.event_name == 'push' # Only run on push events (tags or branches)

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected-artifacts

      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release meta
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
            MAKE_LATEST="true"
            REF_KIND="tag"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            TS=$(date -u +%Y%m%d-%H%MZ)
            SHORT_SHA=$(git rev-parse --short=8 HEAD)
            TAG_NAME="${BRANCH_NAME}-${TS}-${SHORT_SHA}"
            PRERELEASE="true"
            MAKE_LATEST="false"
            REF_KIND="branch"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"
          echo "ref_kind=$REF_KIND" >> "$GITHUB_OUTPUT"

      - name: List collected artifacts
        run: |
          echo "--- Collected Artifacts ---"
          ls -R collected-artifacts || echo "No artifacts collected."
          echo "---------------------------"

      - name: Collect unique wheels for release
        id: collect_unique
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find collected-artifacts -type f -name "*.whl" -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            if [[ ! -e "release-assets/$base" ]]; then
              cp -f "$f" "release-assets/$base"
            fi
          done
          echo "asset_dir=release-assets" >> "$GITHUB_OUTPUT"
          echo "--- Release Assets ---"
          ls -alh release-assets || echo "No release assets found."
          echo "----------------------"

      - name: Build release body
        id: body
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          TAG="${{ steps.meta.outputs.tag_name }}"

          echo "## Release: $TAG" > RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md

          echo "### Artifacts" >> RELEASE_BODY.md
          if ls release-assets/*.whl >/dev/null 2>&1; then
            echo "" >> RELEASE_BODY.md
            for f in release-assets/*.whl; do
              bn=$(basename "$f")
              echo "- \`$bn\`" >> RELEASE_BODY.md
            done
          else
            echo "" >> RELEASE_BODY.md
            echo "_No wheels found for this release._" >> RELEASE_BODY.md
          fi

          echo "" >> RELEASE_BODY.md
          echo "### Source" >> RELEASE_BODY.md
          if [[ "${{ steps.meta.outputs.ref_kind }}" == "tag" ]]; then
            echo "- Tag: \`$TAG\` ([${SHA:0:8}](${REPO}/commit/${SHA}))" >> RELEASE_BODY.md
            LAST_TAG=$(git describe --tags --abbrev=0 --always || echo "HEAD")
            if [[ "$LAST_TAG" != "HEAD" && "$LAST_TAG" != "$TAG" ]]; then
              echo "- Compare: [${LAST_TAG}...$TAG](${REPO}/compare/${LAST_TAG}...${TAG})" >> RELEASE_BODY.md
            fi
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            echo "- Branch: \`${BRANCH}\` ([${SHA:0:8}](${REPO}/commit/${SHA}))" >> RELEASE_BODY.md
            LAST_TAG=$(git describe --tags --abbrev=0 --always || echo "HEAD")
            if [[ "$LAST_TAG" != "HEAD" ]]; then
              echo "- Compare: [${LAST_TAG}...${SHA:0:8}](${REPO}/compare/${LAST_TAG}...${SHA})" >> RELEASE_BODY.md
            fi
          fi

          echo "body_path=RELEASE_BODY.md" >> "$GITHUB_OUTPUT"
          echo "---- Generated RELEASE_BODY.md ----"
          cat RELEASE_BODY.md
          echo "-----------------------------------"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.tag_name }}
          body_path: ${{ steps.body.outputs.body_path }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: ${{ steps.meta.outputs.prerelease == 'false' }} # Only generate notes for formal releases (tags)
          append_body: false
          files: release-assets/*.whl
