name: Build and Release Wheels
on:
  push:
    tags:
      - "v*.*.*" # Trigger for official releases when a tag is pushed
    branches:
      - develop  # Trigger for pre-releases when develop branch is pushed
  workflow_dispatch: # Allow manual triggering
concurrency:
  group: build-wheel-${{ github.ref }} # Ensure concurrency is per-branch/tag
  cancel-in-progress: true
permissions:
  contents: write # Needed for creating GitHub Releases
jobs:
  build-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build wheel (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t mootdx-builder-${{ matrix.python-version }} \
            -f ${{ github.workspace }}/.github/docker/Dockerfile .
          mkdir -p dist dist_temp
          CONTAINER_ID=$(docker create mootdx-builder-${{ matrix.python-version }})
          docker cp "$CONTAINER_ID:/app/dist/." dist_temp/ || echo "No wheels found in container /app/dist/"
          docker rm "$CONTAINER_ID"
          if [ -n "$(ls -A dist_temp)" ]; then
            mv dist_temp/* dist/
          else
            echo "No wheels were copied from the container."
          fi
          ls -alh dist/ || echo "dist directory is empty or not found."
      - name: Set up Python (Windows only)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install --upgrade pip build wheel setuptools
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
      - name: Build wheel (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          if (Test-Path setup.py) {
            python setup.py bdist_wheel
          } elseif (Test-Path pyproject.toml) {
            python -m build --wheel
          } else {
            echo "No setup.py or pyproject.toml found. Cannot build wheel."
            exit 1
          }
      - name: Identify built wheel
        shell: bash
        id: find_whl
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            WHEEL_PATH=$(find dist -name "*.whl" -print -quit)
          else # windows-latest
            WHEEL_PATH=$(powershell -Command "Get-ChildItem -Path dist -Filter '*.whl' | Select-Object -First 1 | ForEach-Object { $_.FullName }")
          fi
          if [ -z "$WHEEL_PATH" ]; then
            echo "No wheel file found in dist directory."
            echo "wheel_path=" >> "$GITHUB_OUTPUT"
          else
            echo "wheel_path=$WHEEL_PATH" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        if: steps.find_whl.outputs.wheel_path != ''
        with:
          name: mootdx-${{ matrix.python-version }}-${{ matrix.os }}
          path: ${{ steps.find_whl.outputs.wheel_path }}

  release:
    needs: build-wheel
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Choose tag/name (branch uses branch+build number)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            PRERELEASE="false"
            TITLE="Release ${TAG_NAME}"
          else
            BRANCH="${GITHUB_REF_NAME}"
            BUILD_NO="${GITHUB_RUN_NUMBER}"
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-8)"
            TAG_NAME="${BRANCH}-build${BUILD_NO}"
            PRERELEASE="true"
            TITLE="Pre-release ${TAG_NAME} (from ${BRANCH} @ ${SHORT_SHA})"
          fi
          echo "tag_name=${TAG_NAME}"       >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}"   >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}"             >> "$GITHUB_OUTPUT"

      - name: Collect unique wheels (by SHA256) and build release body
        id: body
        shell: bash
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail

          # 检查是否有 wheel
          if ! find dist -type f -name "*.whl" -print -quit | grep -q . ; then
            echo "No wheels found. Skipping release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p release-assets
          declare -A seen

          # 生成 Release body
          {
            echo "## ${TAG_NAME}"
            echo
            if [ "${PRERELEASE}" = "true" ]; then
              SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-8)"
              echo "_Pre-release from branch \`${GITHUB_REF_NAME}\` (commit ${SHORT_SHA})._"
              echo
            fi
            echo "### Artifacts & Checksums"
            echo
          } > RELEASE_BODY.md

          # 去重 + 列表
          while IFS= read -r -d '' f; do
            sha=$(sha256sum "$f" | awk '{print $1}')
            bn=$(basename "$f")
            if [[ -z "${seen[$sha]+x}" ]]; then
              cp -f "$f" "release-assets/$bn"
              seen[$sha]=1
              printf -- "- \`%s\`  \`%s\`\n" "$bn" "$sha" >> RELEASE_BODY.md
            else
              echo "Duplicate skipped (same content): $bn ($sha)"
            fi
          done < <(find dist -type f -name '*.whl' -print0 | sort -z)

          echo "---- RELEASE BODY ----"
          cat RELEASE_BODY.md || true
          echo "----------------------"

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "body_path=RELEASE_BODY.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.body.outputs.proceed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}  # 确保指向本次构建的提交（即使是分支触发）
          name: ${{ steps.meta.outputs.title }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: ${{ steps.body.outputs.body_path }}
          files: release-assets/*.whl
