name: Build Wheels

on:
  push:
    tags:
      - "v*.*.*"
    branches: [ develop ]

concurrency:
  group: build-wheel
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Linux: Docker 构建
      - name: Build wheel with Docker (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t mootdx-builder-${{ matrix.python-version }} \
            -f ${{ github.workspace }}/.github/docker/Dockerfile .

          mkdir -p dist dist_temp

          CONTAINER_ID=$(docker create mootdx-builder-${{ matrix.python-version }})
          docker cp "$CONTAINER_ID:/app/dist/." dist_temp/ || echo "Nothing to copy"
          docker rm "$CONTAINER_ID"

          mv dist_temp/* dist/ 2>/dev/null || echo "No wheel files moved"
          ls -alh dist/ || echo "dist directory not found"

      # ✅ Windows: 原生构建
      - name: Set up Python (Windows only)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          pip install --upgrade pip build wheel setuptools
          pip install -r requirements.txt
          python setup.py bdist_wheel

      # ✅ 提取构建产物路径
      - name: Identify built wheel
        shell: bash
        id: find_whl
        run: |
          WHEEL_PATH=$(find dist -name "*.whl" | head -n 1)
          echo "wheel_path=$WHEEL_PATH" >> "$GITHUB_OUTPUT"

      # ✅ 上传 artifact（无需重命名）
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mootdx-${{ matrix.python-version }}-${{ matrix.os }}
          path: ${{ steps.find_whl.outputs.wheel_path }}

  release:
    name: Create GitHub Release
    needs: build-wheel
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected-artifacts

      # 需要 git 历史来生成比较链接/生成 release notes
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ 生成 tag/name + 预发布标记（tag→正式；branch→预发布）
      - name: Compute release meta
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
            MAKE_LATEST="true"
            REF_KIND="tag"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            TS=$(date -u +%Y%m%d-%H%MZ)   # 使用UTC，避免时区混淆
            SHORT_SHA=$(git rev-parse --short=8 HEAD)
            TAG_NAME="${BRANCH_NAME}-${TS}-${SHORT_SHA}"
            PRERELEASE="true"
            MAKE_LATEST="false"           # 预发布不设为latest，避免污染最新稳定版本
            REF_KIND="branch"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"
          echo "ref_kind=$REF_KIND" >> "$GITHUB_OUTPUT"

      - name: List collected artifacts
        run: ls -R collected-artifacts || true

      # ✅ 去重：只保留“按文件名唯一”的一份 wheel 作为发布资产
      - name: Collect unique wheels
        id: collect_unique
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            if [[ ! -e "release-assets/$base" ]]; then
              cp -f "$f" "release-assets/$base"
              echo "kept: $base"
            else
              echo "dup : $base (skipped)"
            fi
          done < <(find collected-artifacts -type f -name "*.whl" -print0)
          echo "asset_dir=release-assets" >> "$GITHUB_OUTPUT"
          ls -alh release-assets

      # ✅ 生成 Release Body（自动列出 wheels、分支/commit、对比链接等）
      - name: Build release body
        id: body
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          echo "## Artifacts" > RELEASE_BODY.md
          if ls ${{ steps.collect_unique.outputs.asset_dir }}/*.whl >/dev/null 2>&1; then
            echo "" >> RELEASE_BODY.md
            for f in ${{ steps.collect_unique.outputs.asset_dir }}/*.whl; do
              bn=$(basename "$f")
              echo "- \`$bn\`" >> RELEASE_BODY.md
            done
          else
            echo "" >> RELEASE_BODY.md
            echo "_No wheels found._" >> RELEASE_BODY.md
          fi

          echo "" >> RELEASE_BODY.md
          echo "## Source" >> RELEASE_BODY.md
          if [[ "${{ steps.meta.outputs.ref_kind }}" == "tag" ]]; then
            # 正式发布：让 action 生成官方 release notes（下个步骤开启 generate_release_notes）
            LAST_TAG="$(git describe --tags --abbrev=0 --always || true)"
            echo "- Ref: tag \`${{ steps.meta.outputs.tag_name }}\`" >> RELEASE_BODY.md
            echo "- Commit: [$SHA](${REPO}/commit/${SHA})" >> RELEASE_BODY.md
            if [[ -n "$LAST_TAG" && "$LAST_TAG" != "${{ steps.meta.outputs.tag_name }}" ]]; then
              echo "- Compare: ${REPO}/compare/${LAST_TAG}...${{ steps.meta.outputs.tag_name }}" >> RELEASE_BODY.md
            fi
          else
            # 预发布：带上分支名/commit/与最近tag的对比链接
            BRANCH="${GITHUB_REF#refs/heads/}"
            LAST_TAG="$(git describe --tags --abbrev=0 --always || true)"
            echo "- Ref: branch \`${BRANCH}\`" >> RELEASE_BODY.md
            echo "- Commit: [$SHA](${REPO}/commit/${SHA})" >> RELEASE_BODY.md
            if [[ -n "$LAST_TAG" ]]; then
              echo "- Compare: ${REPO}/compare/${LAST_TAG}...${SHA}" >> RELEASE_BODY.md
            fi
          fi

          echo "body_path=RELEASE_BODY.md" >> "$GITHUB_OUTPUT"
          echo "---- RELEASE_BODY.md ----"
          cat RELEASE_BODY.md

      # ✅ 创建（或更新）Release：tag→正式发布并生成官方notes；branch→预发布且不设 latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.tag_name }}
          body_path: ${{ steps.body.outputs.body_path }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          # 只有正式 tag 才启用自动 release notes（PR/commit 汇总）
          generate_release_notes: ${{ steps.meta.outputs.prerelease == 'false' }}
          append_body: false
          files: ${{ steps.collect_unique.outputs.asset_dir }}/*.whl
