name: Build Wheels

on:
  push:
    tags:
      - "v*.*.*"
    branches: [ develop ]

concurrency:
  group: build-wheel
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.8", "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Linux: Docker 构建
      - name: Build wheel with Docker (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          docker build \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            -t mootdx-builder-${{ matrix.python-version }} \
            -f ${{ github.workspace }}/.github/docker/Dockerfile .

          mkdir -p dist dist_temp

          CONTAINER_ID=$(docker create mootdx-builder-${{ matrix.python-version }})
          docker cp "$CONTAINER_ID:/app/dist/." dist_temp/ || echo "Nothing to copy"
          docker rm "$CONTAINER_ID"

          mv dist_temp/* dist/ 2>/dev/null || echo "No wheel files moved"
          ls -alh dist/ || echo "dist directory not found"

      # ✅ Windows: 原生构建
      - name: Set up Python (Windows only)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          pip install --upgrade pip
          pip install build
          python -m build --wheel --outdir dist

      # ✅ 提取构建产物路径
      - name: Identify built wheel
        shell: bash
        id: find_whl
        run: |
          WHEEL_PATH=$(find dist -name "*.whl" | head -n 1)
          echo "wheel_path=$WHEEL_PATH" >> "$GITHUB_OUTPUT"

      # ✅ 上传 artifact（无需重命名）
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mootdx-${{ matrix.python-version }}-${{ matrix.os }}
          path: ${{ steps.find_whl.outputs.wheel_path }}

  release:
    name: Create GitHub Release
    needs: build-wheel
    # if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected-artifacts

      # ✅ 自动提取 tag（若为 tag 推送）或 fallback 到 branch + 时间戳
      - name: Extract release name
        id: release_name
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            TAG_NAME="${BRANCH_NAME}-${TIMESTAMP}"
            PRERELEASE="true"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: List collected artifacts
        run: ls -R collected-artifacts

      # ✅ 去重：只保留“按文件名唯一”的一份 wheel 作为发布资产
      - name: Collect unique wheels
        id: collect_unique
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # 逐个 wheel，按“同名只取第一个”策略去重
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            if [[ ! -e "release-assets/$base" ]]; then
              cp -f "$f" "release-assets/$base"
              echo "kept: $base"
            else
              echo "dup : $base (skipped)"
            fi
          done < <(find collected-artifacts -type f -name "*.whl" -print0)
          echo "asset_dir=release-assets" >> "$GITHUB_OUTPUT"
          ls -alh release-assets

      # ✅ 创建（或更新）Release，并仅上传去重后的 wheel
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_name.outputs.tag_name }}
          name: ${{ steps.release_name.outputs.tag_name }}
          draft: false
          prerelease: ${{ steps.release_name.outputs.prerelease }}
          make_latest: true
          append_body: false
          files: ${{ steps.collect_unique.outputs.asset_dir }}/*.whl
