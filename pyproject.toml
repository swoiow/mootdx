[tool.poetry]
name = "mootdx"
version = "0.11.7"
description = "通达信数据读取接口."
authors = ["bopo <ibopo@126.com>"]
readme = "README.md"
license = "MIT license"
homepage = "https://www.mootdx.com"
repository = "https://github.com/mootdx/mootdx"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.scripts]
mootdx = "mootdx.__main__:entry"

[tool.poetry.dependencies]
python = "^3.8"

# ✅ 最新依赖
httpx = "0.28.1"
tenacity = "9.1.2"
tdxpy = "0.2.7"
tqdm = "4.67.1"
prettytable = "3.16.0"
click = "8.2.1"
typing-extensions = "4.15.0"
mini-racer = "0.13.0"
anyio = "4.10.0"
certifi = "2025.8.3"
colorama = { version = "0.4.6", markers = "platform_system == 'Windows'" }
exceptiongroup = { version = "1.3.0", markers = "python_version < '3.11'" }
h11 = "0.16.0"
httpcore = "1.0.9"
idna = "3.10"
numpy = "2.3.2"
pandas = "2.3.2"
python-dateutil = "2.9.0.post0"
pytz = "2025.2"
six = "1.17.0"
sniffio = "1.3.1"
wcwidth = "0.2.13"

[tool.poetry.group.test.dependencies]
pytest-cov = "^4.0.0"
freezegun = "^1.2.2"
pytest = "^7.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "-p no:warnings"
log_cli = 0
log_cli_level = "DEBUG"

[tool.commitizen]
tag_format = "v$version"
annotated_tag = true
changelog_file = "docs/history.md"
changelog_incremental = true
update_changelog_on_bump = true
version_provider = "poetry"
version_files = [
    "mootdx/__init__.py:__version__",
]

[tool.poe.tasks]
venv = "poetry install --sync"
lock = "poetry lock --no-update"

test = "poetry run pytest"
lint = "ruff check ./mootdx/*.py"

dist = "poetry build -v"
bump = "cz bump --yes -ch -cc --increment"

sync = "make sync"
pypi = "poetry publish --build --skip-existing"
